<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<link rel="icon" href="favicon.ico" sizes="any">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<meta name="theme-color" content="#3a2350">
<title>노을언덕 포격대 · 아리채 오락실</title>
<!-- 아리채 오락실 · 노을언덕 포격대(가칭, 실시간 팀 포격전)
     설계: 1f-study/tank-artillery/DESIGN_tank_artillery_v1.md · 서버 권위: tank.py (메시지 접두사 tk)
     - js/tank/net.js   웹소켓·재접속(tkrejoin)
     - js/tank/sfx.js   Web Audio 합성 배경음(대기실)·효과음(게임) — 외부 음원 없음
     - js/tank/art.js   옆에서 본 탱크·지형·이모티콘 그림(캔버스/SVG로 직접 그림)
     - js/tank/lobby.js 입장·대기실·AI 설정·이모티콘
     - js/tank/game.js  게임 화면(보간·카메라·조작·관전·결과) -->
<link rel="stylesheet" href="css/tank.css">
</head>
<body>
<div id="app">

  <!-- 입장 -->
  <section class="screen" id="s-join">
    <div class="join-sky" aria-hidden="true"><canvas id="join-art"></canvas></div>
    <div class="join-card">
      <h1 class="disp">노을언덕 포격대</h1>
      <p class="join-sub">각도와 파워로 쏘는 실시간 팀 포격전 · 1대1~8대8 (AI 연습 가능)</p>
      <div class="join-row">
        <label class="fld"><span>닉네임</span><input id="j-name" maxlength="8" placeholder="8자까지" autocomplete="off"></label>
        <label class="fld code"><span>방 코드</span><input id="j-code" inputmode="numeric" pattern="[0-9]*" maxlength="4" placeholder="새 방이면 비워요" autocomplete="off"></label>
      </div>
      <div class="join-row">
        <button class="btn btn-yellow" id="j-create" type="button">방 만들기</button>
        <button class="btn btn-green" id="j-enter" type="button">코드로 들어가기</button>
      </div>
      <div class="join-msg" id="j-msg" role="status"></div>
    </div>
    <a class="corner-btn left" id="j-hub" href="/" aria-label="오락실로">‹ 오락실</a>
    <button class="corner-btn right mute-btn" type="button" aria-label="소리 켜기/끄기"></button>
  </section>

  <!-- 대기실 -->
  <section class="screen" id="s-lobby" hidden>
    <header class="lb-top">
      <div class="lb-code">방 코드 <b class="disp" id="lb-code">----</b></div>
      <button class="sbtn" id="lb-copy" type="button">복사</button>
      <div class="lb-count" id="lb-count"></div>
      <div class="lb-warn" id="lb-warn"></div>
      <div class="lb-round" id="lb-round"></div>
      <span class="grow"></span>
      <button class="sbtn" id="lb-watch" type="button" hidden>판 보기</button>
      <button class="sbtn" id="lb-ai" type="button" hidden>AI ⚙</button>
      <button class="sbtn mute-btn" type="button" aria-label="소리 켜기/끄기"></button>
      <button class="sbtn" id="lb-leave" type="button">나가기</button>
    </header>
    <div class="lb-body">
      <div class="lb-team" data-team="A"><div class="lb-th"><span class="tmark A">●</span> 팀 A <small id="lb-ca"></small></div><div class="lb-list" id="lb-la"></div></div>
      <div class="lb-team" data-team="B"><div class="lb-th"><span class="tmark B">▲</span> 팀 B <small id="lb-cb"></small></div><div class="lb-list" id="lb-lb"></div></div>
      <aside class="lb-side">
        <div class="kinds" id="lb-kinds">
          <button type="button" class="kind" data-kind="mongdol"><canvas width="96" height="56"></canvas><span>몽돌</span></button>
          <button type="button" class="kind" data-kind="mangru"><canvas width="96" height="56"></canvas><span>망루</span></button>
        </div>
        <div class="kind-info" id="lb-kinfo"></div>
        <div class="teams">
          <button type="button" class="sbtn tbtn A" data-team="A">● 팀 A로</button>
          <button type="button" class="sbtn tbtn B" data-team="B">▲ 팀 B로</button>
        </div>
        <div class="emos" id="lb-emos"></div>
        <button type="button" class="btn btn-green" id="lb-start">시작하기</button>
        <button type="button" class="btn btn-yellow" id="lb-practice" hidden>연습(AI) 채우기</button>
        <div class="lb-why" id="lb-why"></div>
      </aside>
    </div>
    <div class="lb-bubbles" id="lb-bubbles" aria-hidden="true"></div>
    <!-- AI 설정 창 (방장만) -->
    <div class="sheet" id="ai-sheet" hidden>
      <div class="sheet-top">
        <b>AI 설정</b>
        <button type="button" class="sbtn" data-practice="2v2">연습(AI): 2대2 채우기</button>
        <button type="button" class="sbtn" data-practice="8v8">8대8까지 채우기</button>
        <span class="grow"></span>
        <button type="button" class="sbtn" id="ai-close">닫기</button>
      </div>
      <div class="sheet-body">
        <div class="ai-col" data-team="A"><div class="lb-th"><span class="tmark A">●</span> 팀 A</div><div class="ai-list"></div>
          <button type="button" class="sbtn ai-add" data-team="A">+ AI 넣기</button></div>
        <div class="ai-col" data-team="B"><div class="lb-th"><span class="tmark B">▲</span> 팀 B</div><div class="ai-list"></div>
          <button type="button" class="sbtn ai-add" data-team="B">+ AI 넣기</button></div>
      </div>
    </div>
  </section>

  <!-- 게임 -->
  <section class="screen" id="s-game" hidden>
    <canvas id="gc"></canvas>
    <header class="hud">
      <div class="hteam A" id="h-a"><span class="tmark A">●</span><b id="h-an">0</b><i><em id="h-ab"></em></i></div>
      <div class="hteam B" id="h-b"><span class="tmark B">▲</span><b id="h-bn">0</b><i><em id="h-bb"></em></i></div>
      <div class="htime disp" id="h-time">5:00</div>
      <div class="hwind" id="h-wind" data-wind="0" data-blink="0"><span>바람</span><svg viewBox="0 0 48 20" width="48" height="20"><path id="h-warrow" d="M4 10 H40 M32 4 L42 10 L32 16" stroke="#fff" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg><b id="h-wlv">0</b></div>
      <canvas class="hmini" id="h-mini" width="120" height="32"></canvas>
      <button class="hbtn" id="h-zoom" type="button" aria-label="전체 보기">전체</button>
      <button class="hbtn" id="h-menu" type="button" aria-label="메뉴">≡</button>
    </header>

    <div class="ctl" id="ctl">
      <div class="fuel" id="fuel"><i><em id="fuel-bar"></em></i><span id="fuel-n">100</span></div>
      <button class="pad mv" id="b-left" type="button" aria-label="왼쪽">◀</button>
      <button class="pad mv" id="b-right" type="button" aria-label="오른쪽">▶</button>
      <div class="aimread" id="aimread">각도 0° · 파워 0</div>
      <div class="angbtns">
        <button class="pad ang" id="b-up" type="button" aria-label="포신 위로">▲</button>
        <button class="pad ang" id="b-down" type="button" aria-label="포신 아래로">▼</button>
      </div>
      <div class="power" id="power" aria-label="파워"><div class="ptrack"><em id="p-fill"></em><b id="p-last"></b></div><div class="pknob" id="p-knob"></div><span class="plab">파워</span></div>
      <button class="fire" id="b-fire" type="button" aria-label="발사"><svg viewBox="0 0 84 84"><circle cx="42" cy="42" r="38" class="ring-bg"/><circle cx="42" cy="42" r="38" class="ring" id="fire-ring"/></svg><span id="fire-t">발사</span></button>
    </div>

    <div class="spec" id="spec" hidden>
      <div class="spec-bar" id="spec-bar">관전 중</div>
      <button class="pad sp" id="sp-prev" type="button">◀<small>이전</small></button>
      <button class="pad sp" id="sp-next" type="button">▶<small>다음</small></button>
      <button class="btn btn-yellow sp-back" id="sp-back" type="button">대기실로</button>
    </div>

    <div class="center-msg" id="cdn" hidden></div>
    <div class="result" id="result" hidden></div>
    <div class="sheet small" id="menu" hidden>
      <div class="sheet-top"><b>메뉴</b><span class="grow"></span><button type="button" class="sbtn" id="m-close">닫기</button></div>
      <div class="menu-body">
        <button type="button" class="sbtn mute-btn" aria-label="소리 켜기/끄기"></button>
        <button type="button" class="sbtn" id="m-leave">판 나가기 (탱크는 판 끝까지 남아요)</button>
        <p class="menu-help">◀ ▶ 이동 · ▲ ▼ 포신 · 파워 막대를 위아래로 끌기 · 발사<br>키보드: ← → 이동, ↑ ↓ 포신, W/S 파워, 스페이스 발사</p>
      </div>
    </div>
  </section>

  <div class="toast" id="toast" role="status"></div>
  <div class="rotate" id="rotate"><div><svg viewBox="0 0 64 64" width="72" height="72"><rect x="20" y="6" width="24" height="40" rx="4" fill="none" stroke="#fff" stroke-width="3"/><path d="M10 50 Q32 64 54 50" stroke="#FFD23F" stroke-width="3" fill="none"/><path d="M48 44 L54 50 L46 54" stroke="#FFD23F" stroke-width="3" fill="none"/></svg><p>가로로 돌려 주세요</p></div></div>
</div>
<script src="js/tank/sfx.js"></script>
<script src="js/tank/art.js"></script>
<script src="js/tank/net.js"></script>
<script src="js/tank/game.js"></script>
<script src="js/tank/lobby.js"></script>
</body>
</html>
