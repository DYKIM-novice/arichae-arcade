<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#05080f">
<title>패링 손맛 데모</title>
<!-- 아리채 오락실 · 회귀 RPG 1인칭 색 패링 「패링 손맛」 단독 데모 페이지
     - 규칙은 진짜 게임과 같은 data.js + sim.js 를 그대로 써요 (타이밍이 게임과 똑같아요)
     - 효과·소리·카메라·리플레이는 js/rpg/demo.js 에만 있어요 (공용 파일은 건드리지 않아요) -->
<style>
  :root {
    --bg: #05080f;
    --ink: #f4f1e8;
    --dim: #9aa6bd;
    --gold: #ffd25a;
    --red: #ff4d5e;
    --green: #2fd27a;
    --blue: #3d8bff;
    --panel: rgba(6, 10, 20, .86);
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; height: 100%; background: var(--bg); color: var(--ink); overflow: hidden;
    font-family: system-ui, -apple-system, "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", sans-serif;
    overscroll-behavior: none; touch-action: none; user-select: none; -webkit-user-select: none;
  }
  #app { position: fixed; inset: 0; overflow: hidden; }
  #cv { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }

  /* 위: 오늘의 패링 · 보스 체력 · 톱니 */
  #top {
    position: absolute; left: 0; right: 0; top: 0; display: flex; align-items: center; gap: 8px;
    padding: calc(env(safe-area-inset-top, 0px) + 10px) 12px 0; pointer-events: none;
  }
  #top > * { pointer-events: auto; }
  .chip {
    border: 1px solid rgba(255, 255, 255, .18); background: rgba(8, 12, 24, .62); color: var(--ink);
    border-radius: 999px; height: 36px; padding: 0 12px; font: 700 13px/1 inherit; font-family: inherit;
    display: inline-flex; align-items: center; gap: 6px; backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px);
  }
  .chip:disabled { opacity: .38; }
  .chip.hot { border-color: var(--gold); box-shadow: 0 0 0 2px rgba(255, 210, 90, .35), 0 0 18px rgba(255, 210, 90, .45); animation: hot 1.2s ease-in-out infinite; }
  @keyframes hot { 50% { box-shadow: 0 0 0 4px rgba(255, 210, 90, .15), 0 0 28px rgba(255, 210, 90, .7); } }
  #gear { width: 36px; padding: 0; justify-content: center; font-size: 18px; }
  #boss { flex: 1; min-width: 0; text-align: center; pointer-events: none !important; }
  #bossName { font-size: 12px; font-weight: 800; letter-spacing: .04em; color: #d9d0ff; text-shadow: 0 1px 3px #000; }
  #bossBar { margin: 4px auto 0; height: 7px; width: 100%; max-width: 190px; border-radius: 9px; background: rgba(0, 0, 0, .55); overflow: hidden; border: 1px solid rgba(255, 255, 255, .15); }
  #bossBar i { display: block; height: 100%; width: 100%; background: linear-gradient(90deg, #8b5cff, #d76bff); transform-origin: left; }

  /* 아래: 체력 · 게이지 · 연속 · 버튼 3개 */
  #panel {
    position: absolute; left: 0; right: 0; bottom: 0;
    padding: 10px 14px calc(env(safe-area-inset-bottom, 0px) + 14px);
    background: linear-gradient(180deg, rgba(5, 8, 15, 0) 0, rgba(5, 8, 15, .78) 22px, var(--panel) 60px);
  }
  #stats { display: flex; align-items: center; gap: 12px; margin: 0 2px 10px; }
  #bars { flex: 1; display: flex; flex-direction: column; gap: 6px; min-width: 0; }
  .bar { display: flex; align-items: center; gap: 8px; font-size: 11px; font-weight: 800; color: var(--dim); }
  .bar b { width: 28px; flex: none; }
  .bar .track { flex: 1; height: 12px; border-radius: 10px; background: rgba(255, 255, 255, .08); overflow: hidden; border: 1px solid rgba(255, 255, 255, .12); position: relative; }
  .bar .track i { position: absolute; inset: 0; transform-origin: left; }
  #hpFill { background: linear-gradient(90deg, #ff6b6b, #ffb347 40%, #64e39a 75%); }
  #hpFill.refill { animation: refill .6s ease-out; }
  @keyframes refill { 0% { filter: brightness(2.6); } 100% { filter: none; } }
  #gaFill { background: linear-gradient(90deg, #ffb72e, #ffe68a); }
  #gaFill.full { animation: full .7s ease-in-out infinite; }
  @keyframes full { 50% { filter: brightness(1.6); } }
  #streak {
    flex: none; width: 92px; text-align: center; font-weight: 900; line-height: 1; color: var(--gold);
    text-shadow: 0 2px 0 #7a4a00, 0 0 18px rgba(255, 190, 60, .55); opacity: 0; transition: opacity .2s;
  }
  #streak.on { opacity: 1; }
  #streak small { display: block; font-size: 10px; letter-spacing: .1em; color: #ffe9b0; text-shadow: none; margin-top: 2px; }
  #btns { display: flex; gap: 10px; }
  .btn {
    flex: 1; height: 118px; border-radius: 24px; border: 0; color: #fff; position: relative;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px;
    font: 900 17px/1 inherit; font-family: inherit; touch-action: none;
    box-shadow: inset 0 -6px 0 rgba(0, 0, 0, .28), inset 0 2px 0 rgba(255, 255, 255, .35), 0 8px 20px rgba(0, 0, 0, .45);
    transition: transform .06s, filter .06s;
  }
  .btn svg { width: 46px; height: 46px; filter: drop-shadow(0 2px 0 rgba(0, 0, 0, .3)); }
  .btn span { text-shadow: 0 2px 0 rgba(0, 0, 0, .3); }
  .btn kbd { position: absolute; right: 10px; top: 8px; font: 700 10px/1 inherit; font-family: inherit; opacity: .55; }
  .btn.r { background: linear-gradient(180deg, #ff7381, #e3233a); }
  .btn.g { background: linear-gradient(180deg, #5ef0a0, #14a85a); }
  .btn.b { background: linear-gradient(180deg, #6fb0ff, #1f5fe0); }
  .btn.down { transform: translateY(3px) scale(.95); filter: brightness(1.35); box-shadow: inset 0 -2px 0 rgba(0, 0, 0, .28), 0 3px 8px rgba(0, 0, 0, .45); }
  .btn.tut { animation: tutGlow .5s ease-in-out infinite alternate; z-index: 2; }
  @keyframes tutGlow { from { box-shadow: 0 0 0 3px #fff, 0 0 18px 4px rgba(255, 255, 255, .7); transform: scale(1); } to { box-shadow: 0 0 0 6px #fff, 0 0 40px 14px rgba(255, 255, 255, .9); transform: scale(1.06); } }
  .btn.dimmed { filter: brightness(.35) saturate(.4); }

  /* 시작 화면 (첫 터치로 소리를 켜요) */
  #start {
    position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px;
    background: radial-gradient(ellipse at 50% 40%, rgba(40, 30, 80, .55), rgba(3, 5, 10, .92) 70%); z-index: 20; text-align: center; padding: 24px;
  }
  #start h1 { margin: 0; font-size: 40px; font-weight: 900; letter-spacing: -.02em; color: var(--gold); text-shadow: 0 3px 0 #6b3d00, 0 0 30px rgba(255, 200, 80, .5); }
  #start p { margin: 0; color: #cfd6e6; font-size: 15px; line-height: 1.6; }
  #start .go { margin-top: 18px; font-size: 18px; font-weight: 900; padding: 16px 34px; border-radius: 999px; background: #fff; color: #10142a; animation: pulse 1.1s ease-in-out infinite; }
  @keyframes pulse { 50% { transform: scale(1.07); } }
  #start .keys { font-size: 12px; color: var(--dim); }

  /* 리플레이 레터박스 */
  .lb { position: absolute; left: 0; right: 0; height: 15%; background: #000; z-index: 15; transition: transform .35s cubic-bezier(.2, .8, .2, 1); pointer-events: none; display: flex; align-items: center; justify-content: center; }
  #lbTop { top: 0; transform: translateY(-101%); }
  #lbBot { bottom: 0; transform: translateY(101%); flex-direction: column; gap: 6px; }
  #app.replay #lbTop, #app.replay #lbBot { transform: none; }
  #lbTop b { font-size: 13px; letter-spacing: .3em; color: #ff5a5a; font-weight: 900; }
  #lbTop b::before { content: "● "; animation: blink 1s steps(2) infinite; }
  @keyframes blink { 50% { opacity: 0; } }
  #lbTop em { position: absolute; right: 16px; font-style: normal; font-weight: 900; color: #fff; font-size: 14px; opacity: .8; }
  #lbBot strong { font-size: 22px; font-weight: 900; color: var(--gold); }
  #lbBot span { font-size: 12px; color: var(--dim); }

  /* 손맛 조절판 (톱니로 열고 닫아요) */
  #tune {
    position: absolute; right: 10px; top: calc(env(safe-area-inset-top, 0px) + 54px); width: min(300px, calc(100% - 20px)); z-index: 25;
    background: rgba(10, 14, 28, .94); border: 1px solid rgba(255, 255, 255, .16); border-radius: 18px; padding: 12px 14px 14px;
    box-shadow: 0 18px 40px rgba(0, 0, 0, .6); font-size: 13px;
  }
  #tune[hidden] { display: none; }
  #tune h3 { margin: 0 0 8px; font-size: 14px; display: flex; justify-content: space-between; align-items: center; }
  #tune h3 button { font: 700 12px/1 inherit; font-family: inherit; background: rgba(255, 255, 255, .1); color: var(--ink); border: 0; border-radius: 8px; padding: 6px 9px; }
  #tune label { display: grid; grid-template-columns: 1fr 52px; align-items: center; gap: 2px 8px; margin: 9px 0; }
  #tune label output { text-align: right; color: var(--gold); font-weight: 800; font-variant-numeric: tabular-nums; }
  #tune input[type=range] { grid-column: 1 / -1; width: 100%; accent-color: var(--gold); height: 26px; }
  #tune .row { display: flex; align-items: center; justify-content: space-between; margin: 10px 0 2px; }
  #tune input[type=checkbox] { width: 22px; height: 22px; accent-color: var(--gold); }
  #tune .note { margin-top: 8px; font-size: 11px; color: var(--dim); line-height: 1.5; }
</style>
</head>
<body>
<div id="app">
  <canvas id="cv"></canvas>

  <div id="top">
    <button class="chip" id="replayBtn" disabled>▶ 오늘의 패링</button>
    <div id="boss"><div id="bossName">울음곶의 폭풍 문어</div><div id="bossBar"><i id="bossFill"></i></div></div>
    <button class="chip" id="gear" aria-label="손맛 조절">⚙</button>
  </div>

  <div id="panel">
    <div id="stats">
      <div id="bars">
        <div class="bar"><b>체력</b><div class="track"><i id="hpFill"></i></div></div>
        <div class="bar"><b>필살</b><div class="track"><i id="gaFill"></i></div></div>
      </div>
      <div id="streak"><span id="streakN">x2</span><small>연속 패링</small></div>
    </div>
    <div id="btns">
      <button class="btn r" data-c="r" aria-label="빨강"><kbd>A</kbd>
        <svg viewBox="0 0 40 40"><path d="M20 5 L36 34 H4 Z" fill="#fff"/></svg><span>빨강</span></button>
      <button class="btn g" data-c="g" aria-label="초록"><kbd>S</kbd>
        <svg viewBox="0 0 40 40"><circle cx="20" cy="20" r="15" fill="#fff"/></svg><span>초록</span></button>
      <button class="btn b" data-c="b" aria-label="파랑"><kbd>D</kbd>
        <svg viewBox="0 0 40 40"><rect x="6" y="6" width="28" height="28" rx="3" fill="#fff"/></svg><span>파랑</span></button>
    </div>
  </div>

  <div class="lb" id="lbTop"><b>REPLAY</b><em>0.3×</em></div>
  <div class="lb" id="lbBot"><strong id="lbTitle">오늘의 패링</strong><span>화면을 누르면 돌아가요</span></div>

  <div id="tune" hidden>
    <h3>손맛 조절 <button id="tuneReset">기본값</button></h3>
    <label>세상 멈춤 (ms)<output id="o_freeze"></output><input type="range" id="t_freeze" min="0" max="700" step="10"></label>
    <label>황금빛 세기<output id="o_gold"></output><input type="range" id="t_gold" min="0" max="1" step="0.05"></label>
    <label>확대 (줌)<output id="o_zoom"></output><input type="range" id="t_zoom" min="0" max="0.35" step="0.01"></label>
    <label>흔들림 상한 (px)<output id="o_shake"></output><input type="range" id="t_shake" min="0" max="40" step="1"></label>
    <label>소리 크기<output id="o_vol"></output><input type="range" id="t_vol" min="0" max="1" step="0.05"></label>
    <div class="row"><span>흰 번쩍임 · 반전 프레임</span><input type="checkbox" id="t_flash"></div>
    <div class="note">이 폰에 저장돼요. 데모라서 체력이 줄면 저절로 다시 차요.</div>
  </div>

  <div id="start">
    <h1>폭풍을 멈춰라</h1>
    <p>울음곶의 폭풍 문어가 촉수를 휘둘러요.<br>고리가 가운데 원에 닿는 순간,<br><b>같은 색 버튼</b>을 누르면 패링!</p>
    <div class="go">탭해서 시작</div>
    <div class="keys">키보드: A 빨강 · S 초록 · D 파랑</div>
  </div>
</div>

<script src="js/rpg/data.js"></script>
<script src="js/rpg/sim.js"></script>
<script src="js/rpg/demo.js"></script>
</body>
</html>
