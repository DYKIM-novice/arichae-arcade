<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#f6e3cf">
<title>소라섬 등불 이야기</title>
<!-- 아리채 오락실 · 머지관 · 「소라섬 등불 이야기」 (기획: docs/handoff/specs/merge_seaside.md)
     - 데이터: js/merge/data.js · 규칙: js/merge/core.js (node tools/merge_test.js) · 저장: js/merge/save.js
     - 그림 경로: js/merge/art.js 한 곳 (static/img/merge/... · tools/merge_art.py)
     - 손맛(소리·진동·반짝이): js/merge/fx.js · 화면·조작: js/merge/ui.js
     - 마을 복원(전/후 배경·작업)·이야기 장면: js/merge/town.js · 서버 저장: save.js + server.py /api/merge/* -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&display=swap">
<link rel="stylesheet" href="css/merge.css">
</head>
<body>
<div id="app">
  <img id="bg" alt="" draggable="false">
  <header id="hud">
    <button class="chip round" id="exit" type="button" aria-label="대기실로">‹</button>
    <button class="chip" id="hud-energy" type="button" aria-label="기운"><img data-art="energy" alt=""><span class="en-col"><b id="en">100</b><small id="en-t">가득</small></span></button>
    <span class="grow"></span>
    <div class="chip" id="hud-coin"><img data-art="coin" alt=""><b id="coins">0</b></div>
    <div class="chip" id="hud-star"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2.5l2.9 6 6.6.8-4.9 4.6 1.3 6.5L12 17.2l-5.9 3.2 1.3-6.5L2.5 9.3l6.6-.8z" fill="#f5c142" stroke="#c9901a" stroke-width="1.4" stroke-linejoin="round"/></svg><b id="stars">0</b></div>
    <button class="chip round" id="btn-set" type="button" aria-label="설정">⚙</button>
  </header>
  <section id="orders" aria-label="마을 사람 부탁"></section>
  <main id="board-wrap"><div id="board" role="grid" aria-label="합치기 판"></div>
    <button class="chip round hide" id="btn-undo" type="button" aria-label="되돌리기">↶</button></main>
  <footer id="foot">
    <div id="info"></div>
    <nav id="nav">
      <button type="button" class="nav-b" id="btn-town" aria-label="마을 고치기"><span class="nav-ic">🏡</span><b>마을</b><i class="badge hide" id="town-badge">!</i></button>
      <button type="button" class="nav-b" id="btn-bag" aria-label="가방"><span class="nav-ic">👜</span><b id="bag-n">가방</b><i class="badge hide" id="bag-badge"></i></button>
    </nav>
  </footer>
</div>
<div id="ghost" class="hide"></div>
<canvas id="fx"></canvas>
<div id="toast" role="status" aria-live="polite"></div>
<div id="sheet" class="hide"></div>
<div id="town" class="hide" role="dialog" aria-label="마을"></div>
<div id="talk" class="hide"></div>
<script src="js/merge/data.js"></script>
<script src="js/merge/core.js"></script>
<script src="js/merge/save.js"></script>
<script src="js/merge/art_list.js"></script>
<script src="js/merge/art.js"></script>
<script src="js/merge/fx.js"></script>
<script src="js/merge/ui.js"></script>
<script src="js/merge/town.js"></script>
</body>
</html>
