<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#05080f">
<title>되감기 선장 · 1장</title>
<!-- 아리채 오락실 · 회귀 RPG 1장 「꽃비 항구와 울음곶」 (1인칭 색 패링)
     - 규칙: js/rpg/data.js + sim.js (단위 시험 그대로) · 회귀 기록: meta.js (대기실과 같은 저장)
     - 그림: js/rpg/art.js 한 곳 (static/img/rpg/<화풍>/<id>.webp) · 이야기: js/rpg/story.js
     - 화면·효과·흐름: js/rpg/ch1.js (패링 효과는 rpg-demo 에서 옮겨 왔어요) -->
<style>
  :root {
    --bg: #05080f; --ink: #f4f1e8; --dim: #9aa6bd; --gold: #ffd25a;
    --red: #ff4d5e; --green: #2fd27a; --blue: #3d8bff; --panel: rgba(6, 10, 20, .86);
    --font: system-ui, -apple-system, "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", sans-serif;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; height: 100%; background: var(--bg); color: var(--ink); overflow: hidden; font-family: var(--font);
    overscroll-behavior: none; touch-action: none; user-select: none; -webkit-user-select: none;
  }
  button { font-family: inherit; }
  #app { position: fixed; inset: 0; overflow: hidden; }
  #cv { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  .hide { display: none !important; }

  /* 위: 나가기 · 방 · 적 체력 · 회차 */
  #top { position: absolute; left: 0; right: 0; top: 0; display: flex; align-items: flex-start; gap: 8px;
    padding: calc(env(safe-area-inset-top, 0px) + 10px) 10px 0; pointer-events: none; z-index: 4; }
  #top > * { pointer-events: auto; }
  .chip { border: 1px solid rgba(255, 255, 255, .18); background: rgba(8, 12, 24, .62); color: var(--ink);
    border-radius: 999px; height: 34px; padding: 0 11px; font: 800 12.5px/1 var(--font);
    display: inline-flex; align-items: center; gap: 5px; backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px); white-space: nowrap; flex: none; }
  #exit { width: 34px; padding: 0; justify-content: center; font-size: 16px; }
  #foe { flex: 1; min-width: 0; text-align: center; pointer-events: none !important; }
  #where { font-size: 11px; font-weight: 800; color: #cfe0ff; text-shadow: 0 1px 3px #000; letter-spacing: .02em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #foeName { margin-top: 3px; font-size: 13px; font-weight: 900; color: #ffe3c4; text-shadow: 0 1px 3px #000; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #foeName em { font-style: normal; font-size: 10px; background: #b8323f; color: #fff; padding: 2px 6px; border-radius: 6px; margin-right: 5px; vertical-align: 1px; }
  #foeBar { margin: 4px auto 0; height: 7px; width: 100%; max-width: 200px; border-radius: 9px; background: rgba(0, 0, 0, .55); overflow: hidden; border: 1px solid rgba(255, 255, 255, .15); }
  #foeBar i { display: block; height: 100%; width: 100%; background: linear-gradient(90deg, #ff7a3d, #ffcf5a); transform-origin: left; }
  #foe.boss #foeBar i { background: linear-gradient(90deg, #8b5cff, #d76bff); }
  #foe.off #foeName, #foe.off #foeBar { visibility: hidden; }
  #loopChip { color: #bfe9ff; }

  /* 아래: 체력 · 게이지 · 연속 · 버튼 3개 */
  #panel { position: absolute; left: 0; right: 0; bottom: 0; z-index: 3;
    padding: 10px 14px calc(env(safe-area-inset-bottom, 0px) + 14px);
    background: linear-gradient(180deg, rgba(5, 8, 15, 0) 0, rgba(5, 8, 15, .78) 22px, var(--panel) 60px); }
  #stats { display: flex; align-items: center; gap: 12px; margin: 0 2px 10px; }
  #bars { flex: 1; display: flex; flex-direction: column; gap: 6px; min-width: 0; }
  .bar { display: flex; align-items: center; gap: 8px; font-size: 11px; font-weight: 800; color: var(--dim); }
  .bar b { width: 30px; flex: none; }
  .bar .track { flex: 1; height: 12px; border-radius: 10px; background: rgba(255, 255, 255, .08); overflow: hidden; border: 1px solid rgba(255, 255, 255, .12); position: relative; }
  .bar .track i { position: absolute; inset: 0; transform-origin: left; }
  .bar span { width: 44px; flex: none; text-align: right; font-variant-numeric: tabular-nums; color: #dfe6f3; }
  #hpFill { background: linear-gradient(90deg, #ff6b6b, #ffb347 40%, #64e39a 75%); }
  #gaFill { background: linear-gradient(90deg, #ffb72e, #ffe68a); }
  #gaFill.full { animation: full .7s ease-in-out infinite; }
  @keyframes full { 50% { filter: brightness(1.6); } }
  #streak { flex: none; width: 88px; text-align: center; font-weight: 900; line-height: 1; color: var(--gold);
    text-shadow: 0 2px 0 #7a4a00, 0 0 18px rgba(255, 190, 60, .55); opacity: 0; transition: opacity .2s; }
  #streak.on { opacity: 1; }
  #streak small { display: block; font-size: 10px; letter-spacing: .1em; color: #ffe9b0; text-shadow: none; margin-top: 2px; }
  #btns { display: flex; gap: 10px; }
  .btn { flex: 1; height: 112px; border-radius: 24px; border: 0; color: #fff; position: relative;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; font: 900 17px/1 var(--font); touch-action: none;
    box-shadow: inset 0 -6px 0 rgba(0, 0, 0, .28), inset 0 2px 0 rgba(255, 255, 255, .35), 0 8px 20px rgba(0, 0, 0, .45); transition: transform .06s, filter .06s; }
  .btn svg { width: 44px; height: 44px; filter: drop-shadow(0 2px 0 rgba(0, 0, 0, .3)); }
  .btn span { text-shadow: 0 2px 0 rgba(0, 0, 0, .3); }
  .btn kbd { position: absolute; right: 10px; top: 8px; font: 700 10px/1 var(--font); opacity: .55; }
  .btn.r { background: linear-gradient(180deg, #ff7381, #e3233a); }
  .btn.g { background: linear-gradient(180deg, #5ef0a0, #14a85a); }
  .btn.b { background: linear-gradient(180deg, #6fb0ff, #1f5fe0); }
  .btn.down { transform: translateY(3px) scale(.95); filter: brightness(1.35); box-shadow: inset 0 -2px 0 rgba(0, 0, 0, .28), 0 3px 8px rgba(0, 0, 0, .45); }
  .btn.tut { animation: tutGlow .5s ease-in-out infinite alternate; z-index: 2; }
  @keyframes tutGlow { from { box-shadow: 0 0 0 3px #fff, 0 0 18px 4px rgba(255, 255, 255, .7); transform: scale(1); } to { box-shadow: 0 0 0 6px #fff, 0 0 40px 14px rgba(255, 255, 255, .9); transform: scale(1.06); } }
  .btn.dimmed { filter: brightness(.35) saturate(.4); }

  /* 카드 고르기 (방을 깬 뒤 · 버튼 색 = 카드 색) */
  #cards { position: absolute; left: 10px; right: 10px; z-index: 5; display: flex; flex-direction: column; gap: 8px; }
  #cards h3 { margin: 0; text-align: center; font-size: 16px; color: var(--gold); text-shadow: 0 2px 4px #000; }
  #cardRow { display: flex; gap: 8px; }
  .card { flex: 1; min-width: 0; border-radius: 16px; border: 3px solid; background: rgba(8, 12, 24, .92); color: var(--ink);
    padding: 10px 6px; display: flex; flex-direction: column; align-items: center; gap: 6px; text-align: center; font: 800 13px/1.25 var(--font); min-height: 112px; }
  .card b { font-size: 14.5px; }
  .card small { font-size: 11.5px; font-weight: 700; color: #cbd5e6; }
  .card i { font-style: normal; font-size: 10.5px; color: var(--gold); }
  .card.c-r { border-color: var(--red); } .card.c-g { border-color: var(--green); } .card.c-b { border-color: var(--blue); } .card.c-x { border-color: #c9a3ff; }
  .card.pick { animation: pick .35s ease-out; }
  @keyframes pick { 50% { transform: scale(1.08); filter: brightness(1.6); } }
  #reroll { align-self: center; }

  /* 짧은 한마디 (멈추지 않음) */
  #talk { position: absolute; left: 10px; right: 10px; z-index: 4; display: flex; align-items: center; gap: 10px; pointer-events: none;
    background: rgba(6, 10, 22, .82); border: 1px solid rgba(255, 255, 255, .14); border-radius: 16px; padding: 8px 12px 8px 8px;
    transform: translateY(-12px); opacity: 0; transition: opacity .25s, transform .25s; }
  #talk.on { opacity: 1; transform: none; }
  #talk canvas { width: 54px; height: 54px; flex: none; border-radius: 12px; background: radial-gradient(circle at 50% 40%, #2a3654, #0b1020); }
  #talk.nar canvas { display: none; }
  #talk b { display: block; font-size: 12px; color: var(--gold); margin-bottom: 2px; }
  #talk p { margin: 0; font-size: 14px; font-weight: 700; line-height: 1.4; }

  /* 큰 알림 */
  #banner { position: absolute; left: 0; right: 0; z-index: 6; text-align: center; pointer-events: none; opacity: 0; transition: opacity .3s; }
  #banner.on { opacity: 1; }
  #banner b { display: block; font-size: 34px; font-weight: 900; color: var(--gold); text-shadow: 0 3px 0 #6b3d00, 0 0 24px rgba(255, 200, 80, .55); letter-spacing: -.01em; }
  #banner span { display: block; margin-top: 6px; font-size: 14px; font-weight: 800; color: #e8eefb; text-shadow: 0 2px 4px #000; }
  #banner.huge b { font-size: 44px; }

  /* 이야기 장면 (대사 상자) */
  #say { position: absolute; left: 0; right: 0; bottom: 0; z-index: 7; padding: 0 12px calc(env(safe-area-inset-bottom, 0px) + 14px); }
  #sayBox { position: relative; background: linear-gradient(180deg, rgba(10, 14, 28, .9), rgba(5, 8, 16, .96)); border: 1px solid rgba(255, 220, 150, .3);
    border-radius: 18px; padding: 14px 16px 16px; min-height: 128px; box-shadow: 0 -10px 40px rgba(0, 0, 0, .5); }
  #sayPic { position: absolute; left: 6px; bottom: calc(100% - 14px); width: 168px; height: 168px; pointer-events: none; }
  #say.nar #sayPic, #say.nar #sayName { display: none; }
  #sayName { display: inline-block; font-size: 13px; font-weight: 900; color: #1b1203; background: var(--gold); border-radius: 8px; padding: 4px 9px; margin-bottom: 8px; }
  #sayName small { font-weight: 800; opacity: .7; margin-left: 4px; }
  #sayText { margin: 0; font-size: 17px; font-weight: 700; line-height: 1.55; min-height: 52px; word-break: keep-all; }
  #say.nar #sayText { font-style: italic; color: #dbe4f5; }
  #say.endcard #sayText { text-align: center; font-size: 21px; font-weight: 900; font-style: normal; color: var(--gold); padding-top: 14px; }
  #sayNext { position: absolute; right: 14px; bottom: 10px; font-size: 12px; color: var(--dim); animation: blink 1s steps(2) infinite; }
  @keyframes blink { 50% { opacity: .2; } }
  #skip { position: absolute; right: 12px; top: calc(env(safe-area-inset-top, 0px) + 12px); z-index: 8; }
  #sayTap { position: absolute; inset: 0; z-index: 6; }

  /* 처음 화면 (선장 고르기) */
  .over { position: absolute; inset: 0; z-index: 9; overflow-y: auto; overflow-x: hidden; touch-action: pan-y; -webkit-overflow-scrolling: touch;
    padding: calc(env(safe-area-inset-top, 0px) + 18px) 16px calc(env(safe-area-inset-bottom, 0px) + 20px); }
  #title { display: flex; flex-direction: column; align-items: center; gap: 12px; text-align: center;
    background: linear-gradient(180deg, rgba(3, 5, 12, .55), rgba(3, 5, 12, .25) 40%, rgba(3, 5, 12, .85)); }
  #title .ch { margin-top: 18px; font-size: 13px; font-weight: 900; letter-spacing: .3em; color: #ffe9b0; text-shadow: 0 2px 4px #000; }
  #title h1 { margin: 0; font-size: 38px; font-weight: 900; color: var(--gold); line-height: 1.15; text-shadow: 0 3px 0 #6b3d00, 0 0 30px rgba(255, 200, 80, .5); }
  #title p { margin: 0; font-size: 14px; color: #e3e9f5; line-height: 1.55; text-shadow: 0 2px 4px #000; }
  #rec { font-size: 12.5px; font-weight: 800; color: #bfe9ff; background: rgba(6, 10, 22, .7); border-radius: 999px; padding: 7px 14px; }
  #heroes { display: flex; gap: 12px; width: 100%; max-width: 420px; margin-top: 4px; }
  .hero { flex: 1; min-width: 0; border-radius: 20px; border: 2px solid rgba(255, 255, 255, .2); background: rgba(8, 12, 24, .75); color: var(--ink);
    padding: 8px 6px 12px; display: flex; flex-direction: column; align-items: center; gap: 6px; font: 900 16px/1.2 var(--font); }
  .hero canvas { width: 100%; aspect-ratio: 1 / 1.1; display: block; }
  .hero small { font-size: 11.5px; color: var(--dim); font-weight: 700; }
  .hero.on { border-color: var(--gold); box-shadow: 0 0 0 3px rgba(255, 210, 90, .35), 0 0 22px rgba(255, 210, 90, .4); }
  .hero:active { transform: scale(.97); }
  #title .keys { font-size: 11.5px; color: var(--dim); }
  #title .how { font-size: 13px; color: #fff; background: rgba(6, 10, 22, .7); border-radius: 14px; padding: 10px 14px; line-height: 1.6; max-width: 420px; }
  .big { font: 900 18px/1 var(--font); padding: 16px 30px; border-radius: 999px; border: 0; background: var(--gold); color: #1b1203; box-shadow: 0 6px 0 #8a5a00, 0 10px 24px rgba(0, 0, 0, .5); }
  .big:active { transform: translateY(3px); box-shadow: 0 3px 0 #8a5a00; }
  .ghost { font: 800 14px/1 var(--font); padding: 12px 20px; border-radius: 999px; border: 1px solid rgba(255, 255, 255, .3); background: rgba(8, 12, 24, .7); color: var(--ink); }

  /* 정산 (여관) */
  #inn { display: flex; flex-direction: column; align-items: center; gap: 12px; background: linear-gradient(180deg, rgba(3, 5, 12, .15), rgba(3, 5, 12, .55) 45%, rgba(3, 5, 12, .85)); }
  #inn h2 { margin: 10px 0 0; font-size: 34px; font-weight: 900; color: var(--gold); text-shadow: 0 3px 0 #6b3d00, 0 0 24px rgba(255, 200, 80, .5); text-align: center; }
  #inn .sub { font-size: 13px; color: #dfe6f3; text-align: center; }
  #lines { width: 100%; max-width: 420px; background: rgba(6, 10, 22, .78); border: 1px solid rgba(255, 255, 255, .12); border-radius: 16px; padding: 6px 14px; }
  .ln { display: flex; justify-content: space-between; gap: 10px; padding: 9px 0; border-bottom: 1px solid rgba(255, 255, 255, .08); font-size: 14px; font-weight: 700; opacity: 0; transform: translateX(-10px); animation: lnIn .35s ease-out forwards; }
  .ln:last-child { border-bottom: 0; }
  .ln span { color: var(--dim); flex: none; }
  .ln b { text-align: right; color: #fff; }
  .ln.fore b { color: #c9b6ff; } .ln.mem b { color: #9ff0c4; } .ln.total b, .ln.star b { color: var(--gold); }
  @keyframes lnIn { to { opacity: 1; transform: none; } }
  #innTalk { width: 100%; max-width: 420px; display: flex; gap: 10px; align-items: center; background: rgba(6, 10, 22, .78); border-radius: 16px; padding: 8px 12px 8px 8px; }
  #innTalk canvas { width: 64px; height: 64px; flex: none; border-radius: 12px; background: radial-gradient(circle at 50% 40%, #2a3654, #0b1020); }
  #innTalk b { display: block; font-size: 12px; color: var(--gold); }
  #innTalk p { margin: 2px 0 0; font-size: 14px; font-weight: 700; line-height: 1.45; }
  #nodes { width: 100%; max-width: 420px; }
  #nodes h3 { margin: 0 0 6px; font-size: 13px; color: #dfe6f3; display: flex; justify-content: space-between; }
  #nodes h3 em { font-style: normal; color: var(--gold); }
  #nodeRow { display: flex; gap: 8px; }
  .node { flex: 1; min-width: 0; border-radius: 14px; border: 2px solid; background: rgba(8, 12, 24, .88); color: var(--ink); padding: 8px 4px; font: 800 12px/1.3 var(--font); display: flex; flex-direction: column; align-items: center; gap: 3px; text-align: center; }
  .node.c-r { border-color: var(--red); } .node.c-g { border-color: var(--green); } .node.c-b { border-color: var(--blue); }
  .node small { font-size: 10.5px; color: #cbd5e6; font-weight: 700; }
  .node i { font-style: normal; color: var(--gold); font-size: 11.5px; }
  .node:disabled { opacity: .45; }
  .node.buy { animation: pick .35s ease-out; }
  .node.nope { animation: nope .3s; }
  @keyframes nope { 25% { transform: translateX(-6px); } 75% { transform: translateX(6px); } }
  #innBtns { display: flex; gap: 10px; align-items: center; margin-top: 4px; }
</style>
</head>
<body>
<div id="app">
  <canvas id="cv"></canvas>

  <div id="top" class="hide">
    <button class="chip" id="exit" aria-label="나가기">✕</button>
    <div id="foe" class="off"><div id="where"></div><div id="foeName"></div><div id="foeBar"><i id="foeFill"></i></div></div>
    <div class="chip" id="loopChip">1회차</div>
  </div>

  <div id="talk"><canvas width="108" height="108"></canvas><div><b></b><p></p></div></div>
  <div id="banner"><b></b><span></span></div>

  <div id="cards" class="hide"><h3>방을 지났어요 · 카드 하나를 골라요</h3><div id="cardRow"></div><button class="ghost" id="reroll">다시 뽑기</button></div>

  <div id="panel" class="hide">
    <div id="stats">
      <div id="bars">
        <div class="bar"><b>체력</b><div class="track"><i id="hpFill"></i></div><span id="hpTxt"></span></div>
        <div class="bar"><b>필살</b><div class="track"><i id="gaFill"></i></div><span id="lvTxt"></span></div>
      </div>
      <div id="streak"><span id="streakN">x2</span><small>연속 패링</small></div>
    </div>
    <div id="btns">
      <button class="btn r" data-c="r" aria-label="빨강"><kbd>A</kbd>
        <svg viewBox="0 0 40 40"><path d="M20 5 L36 34 H4 Z" fill="#fff"/></svg><span>빨강</span></button>
      <button class="btn g" data-c="g" aria-label="초록"><kbd>S</kbd>
        <svg viewBox="0 0 40 40"><circle cx="20" cy="20" r="15" fill="#fff"/></svg><span>초록</span></button>
      <button class="btn b" data-c="b" aria-label="파랑"><kbd>D</kbd>
        <svg viewBox="0 0 40 40"><rect x="6" y="6" width="28" height="28" rx="3" fill="#fff"/></svg><span>파랑</span></button>
    </div>
  </div>

  <div id="sayTap" class="hide"></div>
  <div id="say" class="hide">
    <div id="sayBox"><canvas id="sayPic" width="336" height="336"></canvas><div id="sayName"></div><p id="sayText"></p><span id="sayNext">▼ 눌러서 계속</span></div>
  </div>
  <button class="chip hide" id="skip">건너뛰기 ▶▶</button>

  <div id="title" class="over hide">
    <div class="ch">제1장</div>
    <h1>꽃비 항구와<br>울음곶</h1>
    <p>배가 가라앉으면 별나침반이 시간을 되감아요.<br>기억을 안고, 더 강하게 다시 출항!</p>
    <div id="rec"></div>
    <div id="heroes">
      <button class="hero" data-g="m"><canvas width="320" height="352"></canvas>남자 선장<small>함께 떠날 선장을 골라요</small></button>
      <button class="hero" data-g="f"><canvas width="320" height="352"></canvas>여자 선장<small>함께 떠날 선장을 골라요</small></button>
    </div>
    <div class="how">공격이 닿는 순간, <b>고리와 같은 색</b> 버튼을 누르면 <b>패링!</b><br>세 번 이어서 패링하면 강반격 · 게이지가 차면 세 버튼 같이 = 필살기</div>
    <div class="keys">키보드: A 빨강 · S 초록 · D 파랑</div>
    <button class="ghost" id="titleExit">오락실로 돌아가기</button>
  </div>

  <div id="inn" class="over hide">
    <h2 id="innTitle"></h2>
    <div class="sub" id="innSub"></div>
    <div id="lines"></div>
    <div id="innTalk" class="hide"><canvas width="128" height="128"></canvas><div><b></b><p></p></div></div>
    <div id="nodes"><h3><span>기억의 나무 · 영원히 남아요</span><em id="shards"></em></h3><div id="nodeRow"></div></div>
    <div id="innBtns"><button class="ghost" id="innExit">나가기</button><button class="big" id="innGo">출항!</button></div>
  </div>
</div>

<script src="js/rpg/data.js"></script>
<script src="js/rpg/sim.js"></script>
<script src="js/rpg/meta.js"></script>
<script src="js/rpg/art.js"></script>
<script src="js/rpg/story.js"></script>
<script src="js/rpg/ch1.js"></script>
</body>
</html>
